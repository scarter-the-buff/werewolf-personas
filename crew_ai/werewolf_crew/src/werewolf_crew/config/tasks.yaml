#     - manager
#     - werewolf_a
#     - werewolf_b
#     - villager_a
#     - villager_b
#     - villager_c
#     - villager_d
#     - villager_e

# villager_day_response:
#   description: >
#     Given that you are a villager and given a transcript of the game up to the present point, make a reply to the statement most recently said and addressed to you.

#   expected_output: >
#     Given a transcript of the game up to the present point, make a reply to the statement most recently said and addressed to you.

#     An example of the correct output format is below:

#     [Player Name Here]: "Looks like [Player Name Here] was removed last night."
#     [Player Name Here]: "So we start with six."
#     [Player Name Here]: "Hey [Player Name Here], you've been quiet. What do you think?"
#     [Player Name Here]: [*YOUR RESPONSE HERE*]

#   agent: villager_a

player1_turn:
  description: You are playing the game werewolf. This is the day phase.

    You are Player 1. Read the shared memory and take your move. Update memory by voting for a certain person to remove from the game.

    You must state your reasoning aloud.

  expected_output: Output your reasoning and then, finally, the player you choose to vote away.

player2_turn:
  description: >
    You are playing the game werewolf. This is the day phase.

    You are Player 2. Read the shared memory, especially what Player 1 said and voted. Based on that information, take your move.

    State your reasoning aloud and vote for a player to remove from the game.

  expected_output: >
    Output your reasoning based on Player 1's statement and vote, then finally state the player you vote to remove.

player3_turn:
  description: >
    You are playing the game werewolf. This is the day phase.

    You are Player 3. Review the shared memory including Player 1 and Player 2’s statements and votes.

    Provide your reasoning aloud, taking into account any arguments made so far, and cast your vote.

  expected_output: >
    Output your reasoning based on the discussion so far, then clearly state the player you vote to remove.

player4_turn:
  description: >
    You are playing the game werewolf. This is the day phase.

    You are Player 4. Read all prior statements from Players 1 through 3. Consider emerging patterns and suspicions.

    Contribute your own analysis, explain your thought process, and vote for a player to remove from the game.

  expected_output: >
    Output your reasoning and your vote. Make sure to clearly name the player you are voting against.
