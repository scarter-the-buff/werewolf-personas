# werewolf_round:
#   description: >
#     Play a single round of werewolf. A round consists of a day phase and a night phase.
#     Start with the night phase, in which the two werewolf players choose a villager to remove from the game. They do so using only gestures and facial expressions (simulate these), and they must agree on a single villager to remove.
#     None of the villagers can hear what the werewolves are saying during the night phase.
#     After a villager is removed, the day phase begins.
#     During the day phase, all players discuss among themselves which player they should remove. The werewolves pretend to be villagers during this discussion.
#     At the end of the day phase, the player with the most votes is removed.

#     The players for this round are as follows. Each of these is an agent that the manager in this task can call upon:

#     {players}

#     Generate each utterance, one-by-one, by delegating to the appropriate agent. For example, in order to have Brian say something, delegate the task to Brian and then have Brian share with you the generated output.

#   expected_output: >

#     Output a Python dictionary that can easily be formatted into a JSON file. The dictionary should have the following keys:

#     transcript: Create a round transcript as a string in which all player utterances and communicative gestures are recorded along with the player who makes them.
#     The night phase and the day phase should be clearly marked, as should who votes to remove which players. Players NEVER vote to remove themselves.
#     There are seven agents in total, two werewolves and five villagers.

#     An example of the correct output format is below. Wherever you see [name] or [Player Name Here] in this example, replace that with the correct player's name:

#     NIGHT PHASE

#     [Player Name Here]: *gestures to [name]*
#     [Player Name Here]: *nods*
#     [Player Name Here]: *gestures to [name]*
#     [Player Name Here]: *shakes head*
#     [Player Name Here]: *gestures to [name]*
#     [Player Name Here]: *nods*
#     [Player Name Here]: *taps Villager 4 on the shoulder*

#     *[Player Name Here] ]is removed*

#     DAY PHASE

#     [Player Name Here]: "Looks like [name] was removed last night."
#     [Player Name Here]: "So we start with six."
#     [Player Name Here]: "Hey [name], you've been quiet. What do you think?"
#     ... *Continues from here.*

#     night_elim: The name of the villager who was removed in the night phase, as a string. This should be, for example, "Albert" or "David"

#     day_elim: The name of the villager or werewolf who was removed in the day phase, as a string. This should be,  for example, "Albert" or "David"

